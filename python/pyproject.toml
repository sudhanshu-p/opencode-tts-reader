[project]
name = "opencode-tts-reader"
version = "0.1.0"
description = "Local KittenTTS reader for OpenCode"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "kittenml[mlx]",
  "numpy>=1.26,<3",
  "soundfile>=0.13,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-timeout>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
opencode-tts = "tts_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tts_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the real KittenTTS model"]
timeout = 30
